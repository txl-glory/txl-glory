version: '3.8'
services:
  postgres:
    image: postgres:16.9
    container_name: postgres
    restart: always
    network_mode: bridge
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password.com
      POSTGRES_DB: postgres
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/var/lib/postgresql/data  # 数据持久化
      - ./postgresql.conf:/etc/postgresql/postgresql.conf  # 自定义配置
    command: 
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"  # 加载自定义配置
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432