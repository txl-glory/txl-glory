version: '3.8'
services:
  nginx-proxy-manager:
    image: 'docker.io/jc21/nginx-proxy-manager:2.12.3'
    container_name: nginx-proxy-manager
    restart: always
    network_mode: 'bridge'
    environment:
      TZ: 'Asia/Shanghai'
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt


